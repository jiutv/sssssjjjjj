name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # 打 tag 触发，如 v1.1.1
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: write    # 必须，才能创建 Release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        # 和 TVMobile 完全一致 —— runner 自带 ANDROID_HOME=/usr/local/lib/android/sdk
        # 预装了 cmdline-tools + sdkmanager，JDK 17 能直接跑
        # 关键：绝对不要 unset ANDROID_HOME / ANDROID_SDK_ROOT，只设 ANDROID_SDK_ROOT 覆盖
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Restore signing keystore (if provided)
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d \
              > "${GITHUB_WORKSPACE}/TVBoxOSC.jks"
            echo "SIGNING_STORE_FILE=${GITHUB_WORKSPACE}/TVBoxOSC.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "✓ Keystore restored from secrets"
          else
            echo "⚠ No SIGNING_KEYSTORE_BASE64 secret — 构建将使用默认签名（非正式签名）。"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} apk/ \;
          echo "---- APK list ----"
          ls -la apk/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: apk/*.apk
