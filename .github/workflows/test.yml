name: Build & Release APK

on:
  push:
    branches:
      - main           # 推 main 也自动构建
    tags:
      - 'v*'           # 打 tag 也触发（正式发版）
  workflow_dispatch:    # 也可手动触发

permissions:
  contents: write    # 必须，才能创建 Release

env:
  # Release tag：日期，如 20261109-01
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史算 versionCode

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compute version
        run: |
          # versionCode = 仓库总 commit 数（每天自动递增）
          VERSION_CODE=$(git rev-list --count HEAD)
          # versionName = 日期 yyyy.MM.dd
          VERSION_NAME=$(date +%Y.%m.%d)
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "→ versionCode=${VERSION_CODE}  versionName=${VERSION_NAME}  tag=${RELEASE_TAG}"

      - name: Set up Android SDK
        run: |
          set -e
          # AGP 8+ 要求 SDK 路径只能通过 ANDROID_HOME 注入，不能有 ANDROID_SDK_ROOT 冲突
          unset ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"

          ANDROID_HOME="${GITHUB_WORKSPACE}/android-sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

          # Java 17 运行时才能加载新版 sdkmanager (class file 61.0)
          # Gradle 7.3.3 + AGP 7.2.2 完全支持 JDK 17
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "${ANDROID_HOME}"
          rm /tmp/cmdline.zip

          # sdkmanager 必须放在 cmdline-tools/latest/ 路径下
          mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
          mv "${ANDROID_HOME}/cmdline-tools"/* "${ANDROID_HOME}/cmdline-tools/latest/" 2>/dev/null || true
          rmdir "${ANDROID_HOME}/cmdline-tools" 2>/dev/null || true

          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"

          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Restore signing keystore (if provided)
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d \
              > "${GITHUB_WORKSPACE}/TVBoxOSC.jks"
            echo "SIGNING_STORE_FILE=${GITHUB_WORKSPACE}/TVBoxOSC.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "✓ Keystore restored from secrets"
          else
            echo "⚠ No SIGNING_KEYSTORE_BASE64 secret — 构建将使用默认签名（非正式签名）。"
          fi

      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PVERSION_CODE="${VERSION_CODE}" \
            -PVERSION_NAME="${VERSION_NAME}"

      - name: Collect APK files
        run: |
          mkdir -p apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} apk/ \;
          echo "---- APK list ----"
          ls -la apk/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.VERSION_NAME }} (${{ env.RELEASE_TAG }})
          generate_release_notes: true
          files: apk/*.apk
