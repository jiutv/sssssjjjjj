name: Build & Release APK

on:
  push:
    branches:
      - main           # 推 main 也自动构建
    tags:
      - 'v*'           # 打 tag 也触发（正式发版）
  workflow_dispatch:    # 也可手动触发

permissions:
  contents: write    # 必须，才能创建 Release

env:
  # Release tag：日期，如 20261109-01
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}

jobs:
  build-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle   # ← 自动缓存 Gradle 依赖，下次不用从零下载

      - name: Set up Android SDK
        run: |
          set -e
          # AGP 8+ 要求 SDK 路径只能通过 ANDROID_HOME 注入，不能有 ANDROID_SDK_ROOT 冲突
          unset ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"

          ANDROID_HOME="${GITHUB_WORKSPACE}/android-sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

          # Java 17 运行时才能加载新版 sdkmanager (class file 61.0)
          # Gradle 7.3.3 + AGP 7.2.2 完全支持 JDK 17
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "${ANDROID_HOME}"
          rm /tmp/cmdline.zip

          # sdkmanager 必须放在 cmdline-tools/latest/ 路径下
          mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
          mv "${ANDROID_HOME}/cmdline-tools"/* "${ANDROID_HOME}/cmdline-tools/latest/" 2>/dev/null || true
          rmdir "${ANDROID_HOME}/cmdline-tools" 2>/dev/null || true

          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"

          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Copy signing keystore
        run: |
          cp -v .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks

      - name: Build APK
        env:
          # 网络抖动自动重试 5 次，每次最多 30s 超时
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=30000 -Dorg.gradle.internal.http.socketTimeout=30000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=1000"
        run: |
          unset ANDROID_SDK_ROOT
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} apk/ \;
          echo "---- APK list ----"
          ls -la apk/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: apk/*.apk
