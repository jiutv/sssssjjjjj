name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # 打 tag 触发，如 v1.1.1
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: write    # 必须，才能创建 Release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -e
          ANDROID_HOME="${GITHUB_WORKSPACE}/android-sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

          # command-line tools 9477386 是 2022 年 5 月版，
          # 与 JDK 11 / AGP 7.2.2 / Gradle 7.3.3 稳定兼容。
          # 再新的版本（如 11076708）里的 sdkmanager 要求 Java 17，
          # 会报 UnsupportedClassVersionError (61.0 vs 55.0)。
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
            -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "${ANDROID_HOME}"
          rm /tmp/cmdline.zip

          # sdkmanager 必须放在 cmdline-tools/latest/ 路径下
          mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
          mv "${ANDROID_HOME}/cmdline-tools"/* "${ANDROID_HOME}/cmdline-tools/latest/" 2>/dev/null || true
          rmdir "${ANDROID_HOME}/cmdline-tools" 2>/dev/null || true

          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"

          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Restore signing keystore (if provided)
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d \
              > "${GITHUB_WORKSPACE}/TVBoxOSC.jks"
            echo "SIGNING_STORE_FILE=${GITHUB_WORKSPACE}/TVBoxOSC.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "✓ Keystore restored from secrets"
          else
            echo "⚠ No SIGNING_KEYSTORE_BASE64 secret — 构建将使用默认签名（非正式签名）。"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p apk
          find . -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} apk/ \;
          echo "---- APK list ----"
          ls -la apk/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: apk/*.apk
